about_p2 = "Não acredito em um exercício profissional conflituoso, apressado e desumanizado. Por isso, minhas relações — tanto pessoais quanto profissionais — baseiam-se em uma escuta honesta, na qual o respeito e a autorresponsabilidade são fundamentais."
